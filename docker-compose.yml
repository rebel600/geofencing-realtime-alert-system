services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geofencing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geofencing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: rebel600/geofencing-api:latest
    environment:
      DATABASE_URL: postgres://geo:geo@db:5432/geofencing?sslmode=disable
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: "*"
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
